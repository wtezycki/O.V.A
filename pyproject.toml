[project]
name = "toro"
version = "0.0.0"
description = "A private AI meeting assistant that runs entirely on your laptop."
authors = [
    { name = "Wiktor Tężycki", email = "wtezycki1@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
