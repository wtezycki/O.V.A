[project]
name = "ova"
version = "0.0.0"
description = "O.V.A (On-Device Voice Assistant): a private AI meeting assistant that runs entirely on your laptop."
authors = [
    { name = "Wiktor Tężycki", email = "wtezycki1@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "soundcard>=0.4.6",
]

[project.scripts]
ova = "ova.cli:main"

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cudnn-cu12>=9,<10",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
